syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckInventory (InventoryRequest) returns (InventoryResponse);
}

message InventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryResponse {
  bool available = 1;
  int32 available_quantity = 2;
  string message = 3;
  string item_id = 4;
  int32 quantity = 5;
}